---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  tags: [base]

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [base]

- name: Ensure fd and bat convenience symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: /usr/bin/fdfind, dest: /usr/local/bin/fd }
    - { src: /usr/bin/batcat, dest: /usr/local/bin/bat }
  failed_when: false
  tags: [base]

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  tags: [base]

- name: Allow OpenSSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
  failed_when: false
  tags: [base]

- name: Enable UFW
  community.general.ufw:
    state: enabled
  tags: [base]
